<!DOCTYPE html>
<html lang="ru">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аудио плеер</title>
<body>
<style>
/* ===================== RESET ===================== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }

/* ===================== THEME ===================== */
:root {
  --bg-0:        #0a0a0f;
  --bg-1:        #12121a;
  --bg-2:        #1a1a26;
  --bg-3:        #22222e;
  --surface:    #16161e;
  --accent:     #7c5cfc;
  --accent-2:   #a78bfa;
  --accent-glow: rgba(124,92,252,.35);
  --text:       #f0f0f5;
  --text-dim:   #8a8a9a;
  --text-mute:  #5a5a6a;
  --radius:     16px;
  --radius-sm:  10px;
  --shadow:     0 8px 32px rgba(0,0,0,.45);
  --transition: .25s cubic-bezier(.4,.0,.2,1);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
  background: var(--bg-0);
  color: var(--text);
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* Animated gradient background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 0%, rgba(124,92,252,.12), transparent),
    radial-gradient(ellipse 60% 80% at 100% 100%, rgba(167,139,250,.08), transparent),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(124,92,252,.04), transparent);
  pointer-events: none;
  z-index: 0;
  transition: opacity 1s;
}

/* ===================== HEADER ===================== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
  z-index: 10;
  position: relative;
  flex-shrink: 0;
}
.header__logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.header__logo span {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header__logo .logo-icon { font-size: 26px; }
.header__actions { display: flex; gap: 10px; align-items: center; }

/* ===================== BUTTONS ===================== */
.btn {
  background: var(--bg-2);
  border: 1px solid rgba(255,255,255,.06);
  color: var(--text);
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: var(--transition);
  user-select: none;
  white-space: nowrap;
}
.btn:hover {
  background: var(--bg-3);
  border-color: rgba(255,255,255,.12);
  transform: translateY(-1px);
}
.btn:active { transform: translateY(0); }
.btn--primary {
  background: linear-gradient(135deg, var(--accent), #6d4ef0);
  border: none;
  box-shadow: 0 4px 16px var(--accent-glow);
}
.btn--primary:hover {
  box-shadow: 0 6px 24px var(--accent-glow);
  filter: brightness(1.1);
}
.btn--icon {
  padding: 10px;
  width: 42px;
  height: 42px;
  justify-content: center;
}

/* ===================== MAIN LAYOUT ===================== */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
  z-index: 1;
  min-height: 0;
}

/* ===================== SIDEBAR / NOW PLAYING ===================== */
.sidebar {
  width: 360px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 0 6px 0px;
  gap: 20px;
  overflow-y: auto;
  border-right: 1px solid rgba(255,255,255,.04);
}

.now-playing {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;

  border: 1px solid rgba(255,255,255,.0);
  min-height: 0;
}

.now-playing__art {
  width: 220px;
  height: 220px;
  border-radius: var(--radius);
  background: var(--bg-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 72px;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
  transition: var(--transition);
}
.now-playing__art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.now-playing__art svg {
  color: var(--text-mute);
}
.now-playing__art::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,.06);
  pointer-events: none;
}

.now-playing__info {
  text-align: center;
  width: 100%;
}
.now-playing__title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.now-playing__artist {
  font-size: 14px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Equalizer visual */
.eq-visual {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 32px;
  margin-top: 4px;
}
.eq-visual span {
  width: 4px;
  background: linear-gradient(to top, var(--accent), var(--accent-2));
  border-radius: 2px;
  height: 6px;
  transition: height .08s ease;
}

/* ===================== EQUALIZER PANEL ===================== */
.eq-panel {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  border: 1px solid rgba(255,255,255,.04);
  box-shadow: var(--shadow);
}
.eq-panel__header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.eq-panel__title {
  font-size: 15px;
  font-weight: 700;
}
.eq-presets {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.eq-preset {
  background: var(--bg-2);
  border: 1px solid rgba(255,255,255,.06);
  color: var(--text-dim);
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  transition: var(--transition);
}
.eq-preset:hover { color: var(--text); border-color: rgba(255,255,255,.15); }
.eq-preset.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.eq-sliders {
  display: flex;
  justify-content: space-between;
  gap: 4px;
  height: 140px;
}
.eq-slider {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 1;
}
.eq-slider__label {
  font-size: 10px;
  color: var(--text-mute);
  font-weight: 600;
}
.eq-slider input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  writing-mode: bt-lr;
  -webkit-writing-mode: vertical-lr;
  width: 6px;
  height: 100px;
  background: var(--bg-2);
  border-radius: 3px;
  cursor: pointer;
  outline: none;
}
.eq-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 2px 8px var(--accent-glow);
}
.eq-slider input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border: none;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}
.eq-slider input[type="range"]::-moz-range-track {
  width: 6px;
  background: var(--bg-2);
  border-radius: 3px;
}

/* ===================== PLAYLIST ===================== */
.playlist-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 0 28px 0 24px;
  overflow: hidden;
  min-width: 0;
}
.playlist-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 0 16px;
  flex-shrink: 0;
}
.playlist-header__title { font-size: 18px; font-weight: 700; }
.playlist-header__count { color: var(--text-dim); font-size: 14px; }

.playlist {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-bottom: 10px;
}
/* Custom scrollbar */
.playlist::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 6px; }
.playlist::-webkit-scrollbar-track, .sidebar::-webkit-scrollbar-track { background: transparent; }
.playlist::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.1);
  border-radius: 3px;
}
.playlist::-webkit-scrollbar-thumb:hover, .sidebar::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,.2);
}

.track {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  background: var(--surface);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid transparent;
  flex-shrink: 0;
}
.track:hover {
  background: var(--bg-2);
  border-color: rgba(255,255,255,.06);
}
.track.active {
  background: linear-gradient(135deg, rgba(124,92,252,.12), rgba(167,139,250,.06));
  border-color: rgba(124,92,252,.2);
}
.track__art {
  width: 48px;
  height: 48px;
  border-radius: 8px;
  background: var(--bg-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  overflow: hidden;
  flex-shrink: 0;
}
.track__art img { width: 100%; height: 100%; object-fit: cover; }
.track__art svg { color: var(--text-mute); }
.track__info {
  flex: 1;
  min-width: 0;
}
.track__name {
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.track__meta {
  font-size: 12px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.track__duration {
  font-size: 12px;
  color: var(--text-mute);
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.track.active .track__name { color: var(--accent-2); }

/* Equalizer animation for active track */
.track.active .track__art {
  position: relative;
}
.track-eq {
  position: absolute;
  bottom: 4px;
  right: 4px;
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 14px;
}
.track-eq span {
  width: 2px;
  background: var(--accent-2);
  border-radius: 1px;
  animation: eqBar .6s ease-in-out infinite alternate;
}
.track-eq span:nth-child(1) { height: 6px; animation-delay: 0s; }
.track-eq span:nth-child(2) { height: 12px; animation-delay: .2s; }
.track-eq span:nth-child(3) { height: 8px; animation-delay: .4s; }
@keyframes eqBar {
  from { height: 4px; }
  to { height: 14px; }
}

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 16px;
  color: var(--text-mute);
  text-align: center;
}
.empty-state__icon { opacity: .3; }
.empty-state__icon svg { width: 64px; height: 64px; }
.empty-state__text { font-size: 16px; }

/* ===================== PLAYER BAR ===================== */
.player-bar {
  flex-shrink: 0;
  background: rgba(11, 11, 11, 0.6);
  backdrop-filter: blur(11px);
  -webkit-backdrop-filter: blur(11px);
  border-top: 1px solid rgba(255,255,255,0.1);
  padding: 4px 18px;
  display: flex;
  width: 100%;
  left: 0%;
  padding-bottom:7px;
  align-items: center;
  bottom: 0px;
  z-index: 11;
  position: absolute;
}

.player-bar__info {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 260px;
  flex-shrink: 0;
}
.player-bar__art {
  width: 52px;
  height: 52px;
  border-radius: 10px;
  background: var(--bg-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  overflow: hidden;
  flex-shrink: 0;
}
.player-bar__art img { width: 100%; height: 100%; object-fit: cover; }
.player-bar__art svg { color: var(--text-dim); }
.player-bar__name {
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.player-bar__artist {
  font-size: 12px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.player-bar__center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.controls {
  display: flex;
  align-items: center;
  gap: 8px;
}
.control-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 20px;
  cursor: pointer;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  user-select: none;
}
.control-btn:hover {
  color: var(--text);
  background: rgba(255,255,255,.06);
}
.control-btn.active {
  color: var(--accent-2);
}
.control-btn--play {
  background: linear-gradient(135deg, var(--accent), #6d4ef0);
  color: #fff;
  width: 48px;
  height: 48px;
  font-size: 22px;
  box-shadow: 0 4px 16px var(--accent-glow);
}
.control-btn--play:hover {
  filter: brightness(1.15);
  transform: scale(1.05);
  background: linear-gradient(135deg, var(--accent), #6d4ef0);
}

/* Progress bar */
.progress-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: 600px;
}
.time-label {
  font-size: 12px;
  color: var(--text-mute);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  min-width: 38px;
}
.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--bg-2);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.progress-bar__fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 3px;
  width: 0%;
  transition: width .1s linear;
  position: relative;
}
.progress-bar__fill::after {
  content: '';
  position: absolute;
  right: -6px;
  top: 50%;
  transform: translateY(-50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent-2);
  box-shadow: 0 0 0 4px rgba(167,139,250,.2);
  opacity: 0;
  transition: opacity .2s;
}
.progress-bar:hover .progress-bar__fill::after { opacity: 1; }

/* Volume */
.player-bar__right {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 180px;
  flex-shrink: 0;
  justify-content: flex-end;
}
.volume-control {
  display: flex;
  align-items: center;
  gap: 8px;
}
.volume-control svg {
  flex-shrink: 0;
}
.volume-control input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 90px;
  height: 5px;
  background: var(--bg-2);
  border-radius: 3px;
  cursor: pointer;
  outline: none;
}
.volume-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}
.volume-control input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: none;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

/* ===================== DRAG & DROP OVERLAY ===================== */
.drop-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,10,15,.9);
  backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
  pointer-events: none;
}
.drop-overlay.active { display: flex; }
.drop-overlay__content {
  text-align: center;
  font-size: 24px;
  color: var(--accent-2);
  border: 3px dashed var(--accent);
  border-radius: 24px;
  padding: 60px 80px;
}

/* ===================== TOAST ===================== */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-2);
  border: 1px solid rgba(255,255,255,.1);
  color: var(--text);
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 14px;
  box-shadow: var(--shadow);
  opacity: 0;
  transition: .3s;
  z-index: 1000;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ===================== RESPONSIVE ===================== */
@media (max-width: 900px) {
  .sidebar { width: 280px; }
  .player-bar__info { width: 200px; }
  .player-bar__right { width: 120px; }
  .volume-control input[type="range"] { width: 60px; }
}
@media (max-width: 640px) {
  .header { padding: 14px 16px; }
  .header__logo { font-size: 18px; }
  .main { flex-direction: column; }
  .sidebar {
    width: 100%;
    flex-direction: row;
    padding: 0 16px 16px;
    border-right: none;
    border-bottom: 1px solid rgba(255,255,255,.04);
    overflow-x: auto;
    overflow-y: hidden;
  }
  .now-playing {
    flex-direction: row;
    padding: 16px;
    min-width: 280px;
  }
  .now-playing__art { width: 64px; height: 64px; font-size: 28px; }
  .now-playing__info { text-align: left; }
  .eq-panel { display: none; }
  .eq-visual { display: none; }
  .playlist-area { padding: 0 16px; }
  .player-bar { padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
  .player-bar__info { width: 100%; order: 1; }
  .player-bar__center { order: 2; width: 100%; }
  .player-bar__right { width: 100%; justify-content: center; order: 3; }
  .control-btn { width: 36px; height: 36px; font-size: 18px; }
  .control-btn--play { width: 44px; height: 44px; font-size: 20px; }
  .btn { padding: 8px 14px; font-size: 13px; }
}
@media (max-width: 400px) {
  .player-bar__info { width: 100%; }
  .volume-control { display: none; }
  .player-bar__right { width: auto; }
}

/* File input hidden */
#fileInput { display: none; }

/* Smooth fade-in */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.track { animation: fadeIn .3s ease; }
</style>

<!-- ===================== HEADER ===================== -->
<header class="header">

  <div class="header__actions">
    <button class="control-btn" style="border: 1px solid rgba(244,244,244, 0.4)" id="openBtn" title="Открыть файлы">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
    </button>
    <input type="file" id="fileInput" accept="audio/*" multiple>
  </div>
</header>

<!-- ===================== MAIN ===================== -->
<div class="main">

  <!-- SIDEBAR: Now Playing + Equalizer -->
  <aside class="sidebar">

    <!-- Equalizer -->
    <div class="eq-panel" >
    <div class="now-playing" >
      <div class="now-playing__art" id="npArt">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>

      <div class="now-playing__info">
        <div class="now-playing__title" id="npTitle">Нет трека</div>
        <div class="now-playing__artist" id="npArtist">Выберите файлы для воспроизведения</div>
      </div>
    </div><br><br>
      <div class="eq-panel__header">
        <div class="eq-panel__title"> Эквалайзер</div>
        <button class="eq-preset" id="eqToggle" style="font-size:12px">Вкл</button>
      </div>
      <div class="eq-presets" id="eqPresets">
        <button class="eq-preset active" data-preset="flat">Flat</button>
        <button class="eq-preset" data-preset="bass">Bass</button>
        <button class="eq-preset" data-preset="treble">Treble</button>
        <button class="eq-preset" data-preset="vocal">Vocal</button>
        <button class="eq-preset" data-preset="rock">Rock</button>
        <button class="eq-preset" data-preset="pop">Pop</button>
        <button class="eq-preset" data-preset="electronic">Electronic</button>
      </div>
      <div class="eq-sliders" id="eqSliders"></div>
	  <br>
	  <br>
	  <br>
	  <br>
	  <br>

    </div>
  </aside>

  <!-- PLAYLIST -->
  <div class="playlist-area">
    <div class="playlist-header">
      <div class="playlist-header__title"> Плейлист</div>
      <div class="playlist-header__count" id="playlistCount">0 треков</div>
    </div>
    <div class="playlist" id="playlist">
      <div class="empty-state" id="emptyState">

          <polyline points="17 1 21 5 17 9"/>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"/>

  <div class="drop-overlay__content">Отпустите файлы здесь</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>

const state = {
  tracks: [],         
  currentIndex: -1,
  isPlaying: false,
  isShuffle: false,
  repeatMode: 0,      
  audioCtx: null,
  source: null,
  gainNode: null,
  eqFilters: [],
  eqEnabled: true,
  eqBands: [60, 170, 350, 1000, 3500, 10000],
  eqValues: [0, 0, 0, 0, 0, 0],
  eqFreqLabels: ['60', '170', '350', '1K', '3.5K', '10K'],
};

const EQ_PRESETS = {
  flat:      [0, 0, 0, -5, -6, -7],
  bass:      [8, 6, 3, -12, -12, -12],
  treble:    [0, 0, 0, 0, 4, 8],
  vocal:     [-2, 0, 4, 5, 3, 0],
  rock:      [5, 3, -1, 2, 4, 5],
  pop:       [-1, 2, 4, 3, 0, -1],
  electronic:[6, 4, 0, -2, 3, 7],
};

const $ = id => document.getElementById(id);
const audio = new Audio();
audio.crossOrigin = 'anonymous';

const ICONS = {
  play: '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 4 20 12 6 20"/></svg>',
  pause: '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
  music: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  volHigh: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19" fill="currentColor"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>',
  volLow: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19" fill="currentColor"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>',
  volMute: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19" fill="currentColor"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>',
  repeat: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
  repeatOne: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></svg>',
};

function parseID3(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const buf = e.target.result;
      const view = new DataView(buf);
      let offset = 0;

      if (view.getUint8(0) !== 0x49 || view.getUint8(1) !== 0x44 || view.getUint8(2) !== 0x33) {
        resolve({ art: null, title: null, artist: null });
        return;
      }
      const major = view.getUint8(3);
      
      const size = (view.getUint8(6) << 21) | (view.getUint8(7) << 14) | (view.getUint8(8) << 7) | view.getUint8(9);
      offset = 10;

      if (view.getUint8(5) & 0x40) {
        let extSize;
        if (major === 4) {
          extSize = (view.getUint8(offset) << 21) | (view.getUint8(offset+1) << 14) | (view.getUint8(offset+2) << 7) | view.getUint8(offset+3);
        } else {
          extSize = view.getUint32(offset);
        }
        offset += extSize;
      }

      let art = null, title = null, artist = null;
      const end = Math.min(offset + size, buf.byteLength);

      while (offset < end) {
        let frameId, frameSize, frameFlags;
        if (major >= 3) {
          frameId = String.fromCharCode(view.getUint8(offset), view.getUint8(offset+1), view.getUint8(offset+2), view.getUint8(offset+3));
          if (major === 4) {
            frameSize = (view.getUint8(offset+4) << 21) | (view.getUint8(offset+5) << 14) | (view.getUint8(offset+6) << 7) | view.getUint8(offset+7);
          } else {
            frameSize = view.getUint32(offset + 4);
          }
          frameFlags = view.getUint16(offset + 8);
          offset += 10;
        } else {
          
          frameId = String.fromCharCode(view.getUint8(offset), view.getUint8(offset+1), view.getUint8(offset+2));
          frameSize = (view.getUint8(offset+3) << 16) | (view.getUint8(offset+4) << 8) | view.getUint8(offset+5);
          offset += 6;
        }

        if (frameSize <= 0 || frameSize > buf.byteLength) break;

        const frameData = new Uint8Array(buf, offset, frameSize);

        if (frameId === 'APIC' || frameId === 'PIC') {
          let idx = 0;
          
          const encoding = frameData[0]; idx++;
          if (frameId === 'APIC') {
            
            let mime = '';
            while (frameData[idx] !== 0 && idx < frameData.length) { mime += String.fromCharCode(frameData[idx]); idx++; }
            idx++; 
            
            idx++;
            
            if (encoding === 1 || encoding === 2) {
              
              while (!(frameData[idx] === 0 && frameData[idx+1] === 0) && idx < frameData.length - 1) idx++;
              idx += 2;
            } else {
              while (frameData[idx] !== 0 && idx < frameData.length) idx++;
              idx++;
            }
            
            const imgData = frameData.slice(idx);
            const mimeMatch = mime.match(/image\/(jpeg|png|gif|bmp|webp)/i);
            const mimeStr = mimeMatch ? mimeMatch[0] : 'image/jpeg';
            const blob = new Blob([imgData], { type: mimeStr });
            art = URL.createObjectURL(blob);
          } else {
            
            let fmt = String.fromCharCode(frameData[1], frameData[2], frameData[3]);
            idx += 3;
            idx++; 
            while (frameData[idx] !== 0 && idx < frameData.length) idx++;
            idx++;
            const imgData = frameData.slice(idx);
            let mimeStr = 'image/jpeg';
            if (fmt === 'PNG') mimeStr = 'image/png';
            const blob = new Blob([imgData], { type: mimeStr });
            art = URL.createObjectURL(blob);
          }
        }

        if (frameId === 'TIT2' || frameId === 'TT2') {
          title = decodeID3Text(frameData);
        }

        if (frameId === 'TPE1' || frameId === 'TP1') {
          artist = decodeID3Text(frameData);
        }

        offset += frameSize;
      }

      resolve({ art, title, artist });
    };
    reader.onerror = () => resolve({ art: null, title: null, artist: null });
    reader.readAsArrayBuffer(file);
  });
}

function decodeID3Text(frameData) {
  if (frameData.length < 1) return null;
  const encoding = frameData[0];
  const textData = frameData.slice(1);
  try {
    if (encoding === 0) {
      
      return new TextDecoder('iso-8859-1').decode(textData).replace(/\0+$/, '').trim();
    } else if (encoding === 1) {
      
      return new TextDecoder('utf-16').decode(textData).replace(/\0+$/, '').trim();
    } else if (encoding === 2) {
      
      return new TextDecoder('utf-16be').decode(textData).replace(/\0+$/, '').trim();
    } else if (encoding === 3) {
      
      return new TextDecoder('utf-8').decode(textData).replace(/\0+$/, '').trim();
    }
  } catch (e) {
    return null;
  }
  return null;
}

async function loadFiles(files) {
  const audioFiles = Array.from(files).filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|flac|m4a|aac|opus|webm)$/i.test(f.name));

  if (audioFiles.length === 0) {
    showToast('⚠️ Аудиофайлы не найдены');
    return;
  }

  showToast(` Загрузка ${audioFiles.length} файл(ов)...`);

  for (const file of audioFiles) {
    const url = URL.createObjectURL(file);
    let meta = { art: null, title: null, artist: null };

    if (/\.mp3$/i.test(file.name)) {
      try { meta = await parseID3(file); } catch (e) {}
    }

    const track = {
      file: file,
      name: meta.title || file.name.replace(/\.[^.]+$/, ''),
      artist: meta.artist || 'Неизвестный исполнитель',
      url: url,
      artUrl: meta.art,
      duration: null,
    };

    state.tracks.push(track);
  }

  renderPlaylist();
  showToast(`✅ Загружено: ${audioFiles.length} трек(ов)`);

  if (state.currentIndex === -1 && state.tracks.length > 0) {
    playTrack(0);
  }
}

function renderPlaylist() {
  const list = $('playlist');
  const empty = $('emptyState');

  if (state.tracks.length === 0) {
    if (empty) empty.style.display = '';
    $('playlistCount').textContent = '0 треков';
    return;
  }

  if (empty) empty.style.display = 'none';
  $('playlistCount').textContent = `${state.tracks.length} трек(ов)`;

  list.innerHTML = '';
  state.tracks.forEach((track, i) => {
    const el = document.createElement('div');
    el.className = 'track' + (i === state.currentIndex ? ' active' : '');
    el.dataset.index = i;

    const artHTML = track.artUrl
      ? `<img src="${track.artUrl}" alt="">`
      : ICONS.music;

    const durText = track.duration ? formatTime(track.duration) : '';

    el.innerHTML = `
      <div class="track__art">${artHTML}
        ${i === state.currentIndex && state.isPlaying ? '<div class="track-eq"><span></span><span></span><span></span></div>' : ''}
      </div>
      <div class="track__info">
        <div class="track__name">${escapeHtml(track.name)}</div>
        <div class="track__meta">${escapeHtml(track.artist)}</div>
      </div>
      <div class="track__duration">${durText}</div>
    `;

    el.addEventListener('click', () => playTrack(i));
    list.appendChild(el);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function playTrack(index) {
  if (index < 0 || index >= state.tracks.length) return;

  if (state.currentIndex !== index && audio.src) {
    audio.pause();
  }

  state.currentIndex = index;
  const track = state.tracks[index];

  audio.src = track.url;
  audio.play().then(() => {
    state.isPlaying = true;
    updatePlayButton();
    renderPlaylist();
  }).catch(err => {
    console.error('Playback error:', err);
    showToast('⚠️ Не удалось воспроизвести трек');
  });

  updateNowPlaying(track);
  updatePlayerBar(track);
}

function togglePlay() {
  if (state.currentIndex === -1) {
    if (state.tracks.length > 0) playTrack(0);
    return;
  }

  if (state.isPlaying) {
    audio.pause();
    state.isPlaying = false;
  } else {
    audio.play();
    state.isPlaying = true;
  }
  updatePlayButton();
  renderPlaylist();
}

function nextTrack() {
  if (state.tracks.length === 0) return;

  let next;
  if (state.isShuffle) {
    do {
      next = Math.floor(Math.random() * state.tracks.length);
    } while (next === state.currentIndex && state.tracks.length > 1);
  } else {
    next = state.currentIndex + 1;
    if (next >= state.tracks.length) {
      if (state.repeatMode === 1) next = 0;
      else return; 
    }
  }
  playTrack(next);
}

function prevTrack() {
  if (state.tracks.length === 0) return;
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  let prev = state.currentIndex - 1;
  if (prev < 0) {
    if (state.repeatMode === 1) prev = state.tracks.length - 1;
    else prev = 0;
  }
  playTrack(prev);
}

function updatePlayButton() {
  $('playBtn').innerHTML = state.isPlaying ? ICONS.pause : ICONS.play;
}

function updateNowPlaying(track) {
  $('npTitle').textContent = track.name;
  $('npArtist').textContent = track.artist;
  const art = $('npArt');
  if (track.artUrl) {
    art.innerHTML = `<img src="${track.artUrl}" alt="">`;
  } else {
    art.innerHTML = '<svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
  }
}

function updatePlayerBar(track) {
  $('pbName').textContent = track.name;
  $('pbArtist').textContent = track.artist;
  const art = $('pbArt');
  if (track.artUrl) {
    art.innerHTML = `<img src="${track.artUrl}" alt="">`;
  } else {
    art.innerHTML = ICONS.music;
  }
}

audio.addEventListener('loadedmetadata', () => {
  const track = state.tracks[state.currentIndex];
  if (track) {
    track.duration = audio.duration;
    
    const el = $('playlist').querySelector(`[data-index="${state.currentIndex}"] .track__duration`);
    if (el) el.textContent = formatTime(audio.duration);
  }
  $('totalTime').textContent = formatTime(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const pct = (audio.currentTime / audio.duration) * 100;
    $('progressFill').style.width = pct + '%';
    $('currentTime').textContent = formatTime(audio.currentTime);
  }
});

audio.addEventListener('ended', () => {
  if (state.repeatMode === 2) {
    
    audio.currentTime = 0;
    audio.play();
  } else {
    nextTrack();
  }
});

audio.addEventListener('play', () => {
  state.isPlaying = true;
  updatePlayButton();
  startEqVisual();
});

audio.addEventListener('pause', () => {
  state.isPlaying = false;
  updatePlayButton();
  stopEqVisual();
});

$('progressBar').addEventListener('click', e => {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

$('volumeSlider').addEventListener('input', e => {
  const vol = e.target.value / 100;
  audio.volume = vol;
  if (state.gainNode) state.gainNode.gain.value = vol;
  updateVolumeIcon(vol);
});

function updateVolumeIcon(vol) {
  $('volumeIcon').innerHTML = vol === 0 ? ICONS.volMute : (vol < 0.5 ? ICONS.volLow : ICONS.volHigh);
}

$('volumeIcon').addEventListener('click', () => {
  if (audio.volume > 0) {
    audio._lastVolume = audio.volume;
    audio.volume = 0;
    $('volumeSlider').value = 0;
    updateVolumeIcon(0);
  } else {
    const v = audio._lastVolume || 0.8;
    audio.volume = v;
    $('volumeSlider').value = v * 100;
    updateVolumeIcon(v);
  }
});

$('playBtn').addEventListener('click', togglePlay);
$('nextBtn').addEventListener('click', nextTrack);
$('prevBtn').addEventListener('click', prevTrack);

$('shuffleBtn').addEventListener('click', () => {
  state.isShuffle = !state.isShuffle;
  $('shuffleBtn').classList.toggle('active', state.isShuffle);
  showToast(state.isShuffle ? '🔀 Случайный порядок вкл' : '🔀 Случайный порядок выкл');
});

$('repeatBtn').addEventListener('click', () => {
  state.repeatMode = (state.repeatMode + 1) % 3;
  const btn = $('repeatBtn');
  btn.classList.toggle('active', state.repeatMode > 0);
  $('repeatIcon').outerHTML = state.repeatMode === 2
    ? ICONS.repeatOne.replace('<svg', '<svg id="repeatIcon"')
    : ICONS.repeat.replace('<svg', '<svg id="repeatIcon"');
  const labels = ['Повтор выкл', 'Повтор плейлиста', 'Повтор одного трека'];
  showToast(labels[state.repeatMode]);
});

$('openBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => {
  loadFiles(e.target.files);
  e.target.value = '';
});

const dropOverlay = $('dropOverlay');
let dragCounter = 0;

window.addEventListener('dragenter', e => {
  e.preventDefault();
  dragCounter++;
  if (e.dataTransfer.types.includes('Files')) {
    dropOverlay.classList.add('active');
  }
});

window.addEventListener('dragleave', e => {
  e.preventDefault();
  dragCounter--;
  if (dragCounter <= 0) {
    dragCounter = 0;
    dropOverlay.classList.remove('active');
  }
});

window.addEventListener('dragover', e => e.preventDefault());

window.addEventListener('drop', e => {
  e.preventDefault();
  dragCounter = 0;
  dropOverlay.classList.remove('active');
  if (e.dataTransfer.files.length) {
    loadFiles(e.dataTransfer.files);
  }
});

let toastTimer;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

function formatTime(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function initAudioContext() {
  if (state.audioCtx) return;

  try {
    state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    state.source = state.audioCtx.createMediaElementSource(audio);

    state.eqFilters = state.eqBands.map((freq, i) => {
      const filter = state.audioCtx.createBiquadFilter();
      if (i === 0) filter.type = 'lowshelf';
      else if (i === state.eqBands.length - 1) filter.type = 'highshelf';
      else filter.type = 'peaking';
      filter.frequency.value = freq;
      filter.Q.value = 1.2;
      filter.gain.value = 0;
      return filter;
    });

    state.gainNode = state.audioCtx.createGain();
    state.gainNode.gain.value = audio.volume;

    let node = state.source;
    state.eqFilters.forEach(f => {
      node.connect(f);
      node = f;
    });
    node.connect(state.gainNode);
    state.gainNode.connect(state.audioCtx.destination);

    state.analyser = state.audioCtx.createAnalyser();
    state.analyser.fftSize = 64;
    state.gainNode.connect(state.analyser);
  } catch (e) {
    console.error('AudioContext init error:', e);
  }
}

function buildEqSliders() {
  const container = $('eqSliders');
  container.innerHTML = '';
  state.eqBands.forEach((freq, i) => {
    const div = document.createElement('div');
    div.className = 'eq-slider';
    div.innerHTML = `
      <input type="range" min="-12" max="12" step="1" value="0" data-band="${i}" orient="vertical">
      <div class="eq-slider__label">${state.eqFreqLabels[i]}</div>
    `;
    container.appendChild(div);
  });

  container.querySelectorAll('input[type="range"]').forEach(slider => {
    slider.addEventListener('input', e => {
      const band = parseInt(e.target.dataset.band);
      const val = parseFloat(e.target.value);
      state.eqValues[band] = val;
      if (state.eqFilters[band] && state.eqEnabled) {
        state.eqFilters[band].gain.value = val;
      }
      
      document.querySelectorAll('.eq-preset[data-preset]').forEach(p => p.classList.remove('active'));
    });
  });
}

function applyPreset(name) {
  const preset = EQ_PRESETS[name];
  if (!preset) return;
  state.eqValues = [...preset];
  const sliders = $('eqSliders').querySelectorAll('input[type="range"]');
  sliders.forEach((s, i) => {
    s.value = preset[i];
    if (state.eqFilters[i] && state.eqEnabled) {
      state.eqFilters[i].gain.value = preset[i];
    }
  });
}

document.querySelectorAll('.eq-preset[data-preset]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.eq-preset[data-preset]').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    applyPreset(btn.dataset.preset);
    showToast(`🎚️ Пресет: ${btn.textContent}`);
  });
});

$('eqToggle').addEventListener('click', () => {
  state.eqEnabled = !state.eqEnabled;
  $('eqToggle').textContent = state.eqEnabled ? 'Вкл' : 'Выкл';
  $('eqToggle').classList.toggle('active', state.eqEnabled);
  if (state.eqFilters.length) {
    state.eqFilters.forEach((f, i) => {
      f.gain.value = state.eqEnabled ? state.eqValues[i] : 0;
    });
  }
  showToast(state.eqEnabled ? '🎚️ Эквалайзер вкл' : '🎚️ Эквалайзер выкл');
});

let eqAnimId = null;
function startEqVisual() {
  if (!state.analyser) return;
  const bars = $('eqVisual').querySelectorAll('span');
  const data = new Uint8Array(state.analyser.frequencyBinCount);

  function animate() {
    state.analyser.getByteFrequencyData(data);
    bars.forEach((bar, i) => {
      const idx = Math.floor(i * data.length / bars.length);
      const val = data[idx] || 0;
      const h = Math.max(4, (val / 255) * 30);
      bar.style.height = h + 'px';
    });
    eqAnimId = requestAnimationFrame(animate);
  }
  animate();
}

function stopEqVisual() {
  if (eqAnimId) cancelAnimationFrame(eqAnimId);
  eqAnimId = null;
  const bars = $('eqVisual').querySelectorAll('span');
  bars.forEach(b => b.style.height = '4px');
}

audio.addEventListener('play', () => {
  if (!state.audioCtx) {
    initAudioContext();
    if (state.audioCtx && state.audioCtx.state === 'suspended') {
      state.audioCtx.resume();
    }
  }
  if (state.audioCtx && state.audioCtx.state === 'suspended') {
    state.audioCtx.resume();
  }
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.code) {
    case 'Space':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowRight':
      if (e.shiftKey) nextTrack();
      else if (audio.duration) audio.currentTime = Math.min(audio.currentTime + 5, audio.duration);
      break;
    case 'ArrowLeft':
      if (e.shiftKey) prevTrack();
      else audio.currentTime = Math.max(audio.currentTime - 5, 0);
      break;
    case 'ArrowUp':
      e.preventDefault();
      audio.volume = Math.min(audio.volume + 0.05, 1);
      $('volumeSlider').value = audio.volume * 100;
      updateVolumeIcon(audio.volume);
      break;
    case 'ArrowDown':
      e.preventDefault();
      audio.volume = Math.max(audio.volume - 0.05, 0);
      $('volumeSlider').value = audio.volume * 100;
      updateVolumeIcon(audio.volume);
      break;
  }
});

async function loadFromVault() {
  const DB_NAME = 'FileVaultDB';
  const STORE = 'files';

  let db;
  try {
    db = await new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      
      req.onupgradeneeded = () => {};
    });
  } catch (e) {
    console.error('FileVaultDB open error:', e);
    showToast('⚠️ Хранилище FileVaultDB недоступно');
    return;
  }

  let records;
  try {
    records = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    console.error('FileVaultDB read error:', e);
    db.close();
    showToast('⚠️ Не удалось прочитать хранилище');
    return;
  }
  db.close();

  const files = [];
  for (const rec of records) {
    let blob = null, name = null;

    if (rec instanceof Blob) {
      blob = rec;
      name = rec.name || null;
    } else if (rec && typeof rec === 'object') {
      blob = rec.file || rec.blob || rec.data || rec.content || null;
      name = rec.name || rec.filename || rec.fileName || (blob && blob.name) || null;
    }

    if (!blob || !(blob instanceof Blob)) continue;

    if (!(blob instanceof File)) {
      blob = new File([blob], name || 'track', { type: blob.type || 'audio/mpeg' });
    }
    files.push(blob);
  }

  if (!files.length) {
    showToast('В хранилище FileVaultDB пусто');
    return;
  }

  await loadFiles(files);
}

buildEqSliders();
loadFromVault();
audio.volume = 0.8;
updateVolumeIcon(0.8);
console.log('NovaPlayer initialized ✅');
</script>
