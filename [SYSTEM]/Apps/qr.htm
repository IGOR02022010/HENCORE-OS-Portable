<!DOCTYPE html>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="JSmin/qrcode.min.js"></script>

  <style>
    :root {
      --bg-body: #121212;
      --bg-container: #121212;
      --text-main: #e0e0e0;
      --text-secondary: #a0a0a0;
      --border: #333;
      --accent: #60a5fa;
      --accent-hover: #3b82f6;
      --error: #ef4444;
      --input-bg: #2c2c2c;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: var(--bg-container);
      border-radius: 12px;
      
      padding: 32px;
      max-width: 500px;
      width: 100%;
    }

    h2 {
      margin-top: 0;
      color: var(--text-main);
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    select, input[type="text"], input[type="color"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      border-radius: 6px;
      font-size: 15px;
      color: var(--text-main);
      box-sizing: border-box;
      transition: border-color 0.2s, background-color 0.2s;
    }

    select:focus, input[type="text"]:focus, input[type="color"]:focus {
      outline: none;
      border-color: var(--accent);
      background-color: #383838;
    }

    .button2777 {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--accent);
      color: #000; /* Тёмный текст на яркой кнопке */
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .button2777.secondary {
      background-color: #4b5563;
      color: var(--text-main);
    }
    
    .button2777.secondary:hover {
      background-color: #374151;
    }

    .button2777:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .button2777:disabled {
      background-color: #333;
      color: var(--text-secondary);
      cursor: not-allowed;
    }

    #qrcode {
      margin-top: 24px;
      text-align: center;
    }

    #qrcode img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      /* Для корректного отображения и скачивания на тёмном фоне */
      background-color: white; 
    }

    .error {
      color: var(--error);
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
      display: none;
    }
  </style> <script src=".data/SHINKORscripts/SHINKORdriver1.js"></script><script src=".data/SHINKORscripts/SHINKORdriver2.js"></script><script src=".data/SHINKORscripts/SHINKORdriver3.js"></script><script src=".data/SHINKORscripts/SHINKORdriver4.js"></script><script src=".data/SHINKORscripts/SHINKORdriver5.js"></script><script src=".data/SHINKORscripts/SHINKORdriver6.js"></script>

  <div class="container">

    <div class="form-group">
      <label for="type">Тип данных</label>
      <select id="type">
        <option value="text">Текст</option>
        <option value="url">Ссылка</option>
      </select>
    </div>

    <div class="form-group">
      <label for="content">Введите данные</label>
      <input type="text" id="content" placeholder="Текст или URL (Ограничение 190 символов)..." />
      <div id="error" class="error">Пожалуйста, введите корректные данные</div>
    </div>

    <div class="form-group">
      <label for="colorDark">Цвет модулей (точек)</label>
      <!-- По умолчанию чёрный, чтобы контрастировать с белым фоном внутри картинки -->
      <input type="color" id="colorDark" value="#000000" />
    </div>

    <div class="form-group">
      <label for="colorLight">Цвет фона</label>
      <!-- По умолчанию белый, так как внутри img у нас белый фон для читаемости -->
      <input type="color" id="colorLight" value="#ffffff" />
    </div>

    <button class="button2777" id="generateBtn">Сгенерировать QR‑код</button>
    <button class="button2777" id="downloadBtn" class="secondary" disabled>Скачать QR‑код (PNG)</button>

    <div id="qrcode"></div>
  </div>

  <script>
    const typeSelect = document.getElementById('type');
    const contentInput = document.getElementById('content');
    const colorDarkInput = document.getElementById('colorDark');
    const colorLightInput = document.getElementById('colorLight');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const qrcodeContainer = document.getElementById('qrcode');
    const errorDiv = document.getElementById('error');

    let currentQRCode = null; // Храним экземпляр QRCode для скачивания

    function validateContent(type, content) {
      if (!content || content.trim() === '') {
        return false;
      }
      if (type === 'url') {
        try {
          new URL(content);
          return true;
        } catch (e) {
          return false;
        }
      }
      return true; // Для текста любая непустая строка допустима
    }

    function generateQR() {
      const type = typeSelect.value;
      const content = contentInput.value.trim();
      const colorDark = colorDarkInput.value;
      const colorLight = colorLightInput.value;

      errorDiv.style.display = 'none';

      if (!validateContent(type, content)) {
        errorDiv.style.display = 'block';
        return;
      }

      // Очищаем предыдущий QR‑код
      qrcodeContainer.innerHTML = '';

      // Создаём новый QR‑код и сохраняем ссылку на него
      currentQRCode = new QRCode(qrcodeContainer, {
        text: content,
        width: 256,
        height: 256,
        colorDark: colorDark,
        colorLight: colorLight,
        correctLevel: QRCode.CorrectLevel.H // Высокая коррекция ошибок
      });

      // Активируем кнопку скачивания
      downloadBtn.disabled = false;
    }

    function downloadQR() {
      if (!currentQRCode) return;

      // Находим сгенерированное изображение внутри контейнера
      const img = qrcodeContainer.querySelector('img');
      if (img && img.src) {
        const link = document.createElement('a');
        link.download = 'qr-code.png';
        link.href = img.src;
        link.click();
      }
    }

    generateBtn.addEventListener('click', generateQR);
    downloadBtn.addEventListener('click', downloadQR);

    // Генерация по Enter
    contentInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        generateQR();
      }
    });

    // Автогенерация при изменении типа (опционально)
    typeSelect.addEventListener('change', () => {
      contentInput.value = '';
      qrcodeContainer.innerHTML = '';
      errorDiv.style.display = 'none';
      downloadBtn.disabled = true;
      currentQRCode = null;
    });
  </script>
