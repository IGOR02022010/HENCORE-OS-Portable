<!DOCTYPE html>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1e1e2e;
    --surface: #2a2a3c;
    --surface-hi: #353550;
    --accent: #7c83fd;
    --accent-hi: #a0a6ff;
    --danger: #ff6b6b;
    --text: #e0e0e8;
    --text-dim: #8888aa;
    --border: #3a3a52;
    --radius: 8px;
  }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .toolbar button, .toolbar label.btn {
    background: var(--surface-hi);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    transition: background .15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .toolbar button:hover, .toolbar label.btn:hover { background: var(--accent); border: 1px solid rgba(255,255,255,0.3) }
  .toolbar .spacer { flex: 1; }
  .toolbar .mem-info {
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .breadcrumbs {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    flex-shrink: 0;
    overflow-x: auto;
    white-space: nowrap;
  }
  .breadcrumbs a {
    color: var(--accent-hi);
    text-decoration: none;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .breadcrumbs a:hover { background: var(--surface-hi); }
  .breadcrumbs .sep { color: var(--text-dim); }

  .main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
    align-content: start;
  }
  .main.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    grid-template-columns: none;
  }
  .empty-msg {
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 40px;
  }

  .item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: background .12s, border-color .12s;
    position: relative;
    user-select: none;
  }
  .item:hover { background: var(--surface-hi); border-color: var(--accent); }
  .item.selected { border-color: var(--accent); background: rgba(124,131,253,.15); }
  .item .icon { font-size: 36px; line-height: 1; }
  .item .name {
    font-size: 12px;
    text-align: center;
    word-break: break-word;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .item .size {
    font-size: 10px;
    color: var(--text-dim);
  }
  .item .menu-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
    display: none;
  }
  .item:hover .menu-btn { display: block; }
  .item .menu-btn:hover { background: var(--surface-hi); color: var(--text); }

  .ctx-menu {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    padding: 4px 0;
    z-index: 1000;
    min-width: 160px;
    display: none;
  }
  .ctx-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  .ctx-menu button:hover { background: var(--surface-hi); }
  .ctx-menu button.danger { color: var(--danger); }
  .ctx-menu hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }
  .overlay.active { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    min-width: 360px;
    max-width: 90vw;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-size: 16px;
    margin-bottom: 16px;
  }
  .modal input, .modal textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    font-size: 14px;
    font-family: monospace;
    margin-bottom: 12px;
  }
  .modal textarea { min-height: 200px; resize: vertical; }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }
  .modal .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .modal .actions button {
    padding: 8px 20px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
  }
  .modal .btn-ok { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modal .btn-cancel { background: var(--surface-hi); color: var(--text); }
  .modal .btn-ok:hover { background: var(--accent-hi); }
  .modal .btn-cancel:hover { background: var(--border); }

  .main.drag-over {
    background: rgba(124,131,253,.08);
    outline: 2px dashed var(--accent);
    outline-offset: -4px;
  }
  .closebutton:hover {
  background: #ff4444
  }

  .drop-hint {
    color: var(--accent-hi);
    font-size: 14px;
    margin-left: 8px;
  }
</style> 
<div style="background:#2a2a3c; border: 7px solid #2a2a3c">
</div>
<div class="breadcrumbs" id="breadcrumbs"></div>
<script src="JSmin/jszip.js"></script>
<!-- Toolbar -->
<div class="toolbar">
  <button onclick="upFolder()" id="btn-up"><img src="assets/d_dedent.png" alt="ICON43" style="height: 19px; width: 19px; "> Вверх</button>
  <button onclick="newFolder()"><img src="assets/d_create.png" alt="ICON43" style="height: 19px; width: 19px; "> Папка</button>
  <button onclick="newTextFile()"><img src="assets/d_create.png" alt="ICON43" style="height: 19px; width: 19px; "> Файл</button>
  <label class="btn" for="file-input"><img src="assets/d_open.png" alt="ICON43" style="height: 19px; width: 19px; "> Загрузить файл</label>
<button onclick="downloadvirtualdisc()"><img src="assets/d_save.png" alt="ICON43" style="height: 19px; width: 19px; "> Сохранить всё</button>

  <input type="file"width id="file-input" multiple style="display:none" onchange="handleUpload(this.files)">
  <div class="spacer"></div>
  <div class="mem-info" id="mem-info">Занято: 0 B</div>
  <button onclick="clearAll()" > Очистить диск</button>
</div>

<!-- Breadcrumbs -->

<!-- Main file area -->
<div class="main" id="main" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
</div>

<!-- Context menu -->
<div class="ctx-menu" id="ctx-menu"></div>

<!-- Overlay / Modal -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal"></div>
</div>

<script>

const root = {
  type: 'dir',
  name: '',
  children: new Map(),
  size: 0,
};

let currentPath = [];   // массив имён от корня до текущей папки
let selectedName = null;

/* ---------- Навигация по дереву ---------- */

function getNode(path) {
  let node = root;
  for (const part of path) {
    if (node.type !== 'dir' || !node.children.has(part)) return null;
    node = node.children.get(part);
  }
  return node;
}

function getCurrentDir() {
  return getNode(currentPath);
}

/* ---------- Утилиты ---------- */

function formatSize(bytes) {
  if (bytes === 0) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(1024));
  return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
}

function totalMemory() {
  let total = 0;
  function walk(node) {
    if (node.type === 'file') {
      total += node.size || 0;
    } else {
      for (const child of node.children.values()) walk(child);
    }
  }
  walk(root);
  return total;
}

function updateMemInfo() {
  document.getElementById('mem-info').textContent = 'Занято: ' + formatSize(totalMemory());
}

function isUniqueName(dir, name) {
  return !dir.children.has(name);
}

function makeUnique(dir, base, ext) {
  let name = base + (ext ? '.' + ext : '');
  let i = 1;
  while (!isUniqueName(dir, name)) {
    name = base + ' (' + i + ')' + (ext ? '.' + ext : '');
    i++;
  }
  return name;
}

/* ---------- Рендеринг ---------- */

function render() {
  const dir = getCurrentDir();
  const main = document.getElementById('main');
  main.innerHTML = '';

  if (dir.children.size === 0) {
    main.classList.add('empty');
    main.innerHTML = '<div class="empty-msg">Папка пуста<br><small>Создайте папку или файл, либо перетащите файлы сюда</small></div>';
  } else {
    main.classList.remove('empty');
    // Сортируем: папки сначала, потом по имени
    const entries = [...dir.children.entries()].sort((a, b) => {
      if (a[1].type !== b[1].type) return a[1].type === 'dir' ? -1 : 1;
      return a[0].localeCompare(b[0], 'ru');
    });
    for (const [name, node] of entries) {
      main.appendChild(createItemEl(name, node));
    }
  }

  renderBreadcrumbs();
  updateMemInfo();
}

function createItemEl(name, node) {
  const el = document.createElement('div');
  el.className = 'item' + (selectedName === name ? ' selected' : '');
  el.onclick = (e) => { e.stopPropagation(); selectItem(name); };
  el.ondblclick = () => openItem(name, node);

  let icon = '📃';
  if (node.type === 'dir') icon = '📁';
  else if (name.match(/\.(txt|md|log|csv|json|js|css|html|xml|svg|htm|vtt|xml|inf|dat)$/i)) icon = '📝';
  else if (name.match(/\.(png|jpg|jpeg|gif|bmp|webp|jpe|jfif|dib|avif)$/i)) icon = '🖼';
  else if (name.match(/\.(mp3|wav|ogg|flac|m4a|aac|oga|mid|midi)$/i)) icon = '🎵';
  else if (name.match(/\.(mp4|avi|mkv|webm|mov|ogv)$/i)) icon = '🎬';
  else if (name.match(/\.(zip|rar|7z|tar|gz|wim|iso|bzip2|xz|gzip)$/i)) icon = '📦';

  const sizeText = node.type === 'dir'
    ? (node.children.size + ' эл.')
    : formatSize(node.size || 0);

  el.innerHTML = `
    <button class="menu-btn" title="Меню">⋮</button>
    <div class="icon">${icon}</div>
    <div class="name">${escapeHtml(name)}</div>
    <div class="size">${sizeText}</div>
  `;
  el.querySelector('.menu-btn').onclick = (e) => {
    e.stopPropagation();
    showCtxMenu(e.clientX, e.clientY, name, node);
  };
  el.oncontextmenu = (e) => {
    e.preventDefault();
    e.stopPropagation();
    selectItem(name);
    showCtxMenu(e.clientX, e.clientY, name, node);
  };
  return el;
}

function renderBreadcrumbs() {
  const bc = document.getElementById('breadcrumbs');
  bc.innerHTML = '';
  const home = document.createElement('a');
  home.textContent = '💿  STORAGE ';
  home.onclick = () => { currentPath = []; selectedName = null; render(); };
  bc.appendChild(home);

  let acc = [];
  for (const part of currentPath) {
    acc.push(part);
    bc.appendChild(Object.assign(document.createElement('span'), { className: 'sep', textContent: '/' }));
    const a = document.createElement('a');
    a.textContent = part;
    const pathCopy = [...acc];
    a.onclick = () => { currentPath = pathCopy; selectedName = null; render(); };
    bc.appendChild(a);
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ---------- Выбор и открытие ---------- */

function selectItem(name) {
  selectedName = (selectedName === name) ? null : name;
  render();
}

function openItem(name, node) {
  if (node.type === 'dir') {
    currentPath = [...currentPath, name];
    selectedName = null;
    render();
  } else {
    openFile(name, node);
  }
}

/* ---------- Открытие файла (обновить) ---------- */

function openFile(name, node) {
  if (name.match(/\.(txt|md|log|csv|json|js|css|html|xml|svg|htm|vtt|xml|inf|dat)$/i)) {
    editTextFile(name, node);
  } else if (name.match(/\.(png|jpg|jpeg|gif|bmp|webp|jpe|jfif|dib|avif)$/i)) {
    previewImage(node);
  } else if (name.match(/\.(mp4|avi|mkv|webm|mov|ogv)$/i)) {
    previewMedia(node, 'video');
  } else if (name.match(/\.(mp3|wav|ogg|flac|m4a|aac|oga|mid|midi)$/i)) {
    previewMedia(node, 'audio');
  } else {
    downloadFile(name, node);
  }
}

/* ---------- Создание ---------- */

function newFolder() {
  const dir = getCurrentDir();
  let name = 'Новая папка';
  name = makeUnique(dir, name, '');
  dir.children.set(name, { type: 'dir', name, children: new Map(), size: 0 });
  selectedName = name;
  render();
  renamePrompt(name);
}

function newTextFile() {
  const dir = getCurrentDir();
  let name = 'Новый файл.txt';
  name = makeUnique(dir, 'Новый файл', 'txt');
  dir.children.set(name, { type: 'file', name, content: new ArrayBuffer(0), size: 0 });
  selectedName = name;
  render();
  editTextFile(name, dir.children.get(name));
}

/* ---------- Контекстное меню ---------- */

async function openArchive(name) {
  const dir = getCurrentDir();
  const node = dir.children.get(name);
  if (!node || node.type !== 'file') {
    alert('Это не файл или файл не найден');
    return;
  }

  // Проверяем расширение
  const ext = (name.match(/\.([^.]+)$/) || [])[1]?.toLowerCase();
  if (!['zip'].includes(ext)) {
    alert('Поддерживается только .zip архив без сжатия!!!');
    return;
  }

  try {
    const blob = new Blob([node.content], { type: 'application/zip' });
    const zip = await JSZip.loadAsync(blob);

    // Проходим по всем записям в архиве
    await Promise.all(Object.keys(zip.files).map(async filePath => {
      const file = zip.files[filePath];
      if (!file.dir) {
        // Это файл
        const content = await file.async('arraybuffer');
        const size = content.byteLength;

        // Нормализуем путь: убираем ведущие ./ и т.п.
        const parts = filePath.split('/').filter(p => p !== '' && p !== '.');
        if (parts.length === 0) return; // пустой путь — пропускаем

        let targetDir = dir;
        const fileName = parts.pop();

        // Создаём промежуточные папки, если нужны
        for (const part of parts) {
          if (!targetDir.children.has(part)) {
            targetDir.children.set(part, {
              type: 'dir',
              name: part,
              children: new Map(),
              size: 0,
            });
          }
          targetDir = targetDir.children.get(part);
        }

        // Если имя уже занято — делаем уникальным
        const uniqueName = makeUnique(targetDir, fileName.replace(/\.[^.]+$/, ''), fileName.match(/[^.]+$/)?.[0]);

        targetDir.children.set(uniqueName, {
          type: 'file',
          name: uniqueName,
          content,
          size,
        });
      } else {
        // Это папка — создаём её в дереве (если ещё нет)
        const parts = filePath.slice(0, -1).split('/').filter(p => p !== '' && p !== '.');
        let targetDir = dir;

        for (const part of parts) {
          if (!targetDir.children.has(part)) {
            targetDir.children.set(part, {
              type: 'dir',
              name: part,
              children: new Map(),
              size: 0,
            });
          }
          targetDir = targetDir.children.get(part);
        }
      }
    }));

    render();

  } catch (e) {
    console.error(e);
    alert('Ошибка при распаковке архива (Попробуйте использовать архив с 0 степинью сжатия): ' + e.message);
  }
}

function showCtxMenu(x, y, name, node) {
  const menu = document.getElementById('ctx-menu');
  const isDir = node.type === 'dir';
  const ext = (name.match(/\.([^.]+)$/) || [])[1]?.toLowerCase();
  const isZip = ext === 'zip';

  menu.innerHTML = `
    <button onclick="openCtx('${escapeJs(name)}')"> Открыть </button>
    <button onclick="renameCtx('${escapeJs(name)}')"> Переименовать </button>
    ${isDir ? '' : `<button onclick="downloadCtx('${escapeJs(name)}')"> Скачать</button>`}
    ${isDir ? '' : `<button onclick="editCtx('${escapeJs(name)}')"> Редактировать</button>`}
    ${isZip ? `<button onclick="openArchive('${escapeJs(name)}')"> Распаковать</button>` : ''}
    <hr>
    <button class="danger" onclick="deleteCtx('${escapeJs(name)}')"> Удалить</button>
  `;
  menu.style.display = 'block';
  menu.style.left = Math.min(x, window.innerWidth - 170) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - 200) + 'px';
}

function escapeJs(s) {
  return s.replace(/'/g, "\\'").replace(/\\/g, '\\\\');
}

function hideCtxMenu() {
  document.getElementById('ctx-menu').style.display = 'none';
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.ctx-menu')) hideCtxMenu();
});

/* ---------- Действия контекстного меню ---------- */

function openCtx(name) {
  hideCtxMenu();
  const node = getCurrentDir().children.get(name);
  if (node) openItem(name, node);
}

function renameCtx(name) { hideCtxMenu(); renamePrompt(name); }

function downloadCtx(name) {
  hideCtxMenu();
  const node = getCurrentDir().children.get(name);
  if (node) downloadFile(name, node);
}

function editCtx(name) {
  hideCtxMenu();
  const node = getCurrentDir().children.get(name);
  if (node) editTextFile(name, node);
}

function deleteCtx(name) {
  hideCtxMenu();
  deleteItem(name);
}

/* ---------- Переименование ---------- */

function renamePrompt(name) {
  const dir = getCurrentDir();
  const node = dir.children.get(name);
  if (!node) return;
  showModal('Переименовать', `
    <input type="text" id="modal-input" value="${escapeHtml(name)}" autofocus>
    <div class="actions">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-ok" onclick="doRename('${escapeJs(name)}')">OK</button>
    </div>
  `);
  const input = document.getElementById('modal-input');
  input.focus();
  input.select();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') doRename(name);
    if (e.key === 'Escape') closeModal();
  });
}

function doRename(oldName) {
  const newName = document.getElementById('modal-input').value.trim();
  if (!newName || newName === oldName) { closeModal(); return; }
  const dir = getCurrentDir();
  if (dir.children.has(newName)) {
    alert('Имя уже занято');
    return;
  }
  const node = dir.children.get(oldName);
  node.name = newName;
  dir.children.delete(oldName);
  dir.children.set(newName, node);
  selectedName = newName;
  closeModal();
  render();
}

/* ---------- Удаление ---------- */

function deleteItem(name) {
  const dir = getCurrentDir();
  if (!dir.children.has(name)) return;
  if (!confirm(`Удалить «${name}»?`)) return;
  dir.children.delete(name);
  selectedName = null;
  render();
}

/* ---------- Навигация вверх ---------- */

function upFolder() {
  if (currentPath.length > 0) {
    currentPath.pop();
    selectedName = null;
    render();
  }
}

/* ---------- Скачивание ---------- */

function downloadFile(name, node) {
  const blob = new Blob([node.content], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- Редактирование текста ---------- */

function editTextFile(name, node) {
  const text = bufToText(node.content);
  showModal('Редактировать: ' + name, `
    <textarea id="modal-textarea">${escapeHtml(text)}</textarea>
    <div class="actions">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-ok" onclick="saveText('${escapeJs(name)}')">Сохранить</button>
    </div>
  `);
  const ta = document.getElementById('modal-textarea');
  ta.focus();
  ta.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
}

function saveText(name) {
  const text = document.getElementById('modal-textarea').value;
  const dir = getCurrentDir();
  const node = dir.children.get(name);
  if (!node) { closeModal(); return; }
  node.content = textToBuf(text);
  node.size = node.content.byteLength;
  closeModal();
  render();
}

function bufToText(buf) {
  if (!buf || buf.byteLength === 0) return '';
  return new TextDecoder('utf-8').decode(new Uint8Array(buf));
}

function textToBuf(text) {
  const enc = new TextEncoder().encode(text);
  return enc.buffer;
}

/* ---------- Просмотр изображения ---------- */

function previewImage(node) {
  const blob = new Blob([node.content]);
  const url = URL.createObjectURL(blob);
  showModal('Просмотр изображения', `
    <div style="text-align:center">
      <img src="${url}" style="max-width:100%;max-height:60vh;border-radius:8px;">
      <div class="actions" style="margin-top:12px">
        <button class="btn-cancel" onclick="closeModal()">Закрыть</button>
      </div>
    </div>
  `);
}
/* ---------- Просмотр медиа (новая функция) ---------- */

function previewMedia(node, kind) {
  // kind: 'video' или 'audio'
  const mime = guessMime(node.name);
  const blob = new Blob([node.content], mime ? { type: mime } : {});
  const url = URL.createObjectURL(blob);

  const tag = kind === 'video' ? 'video' : 'audio';

  showModal('Просмотр: ' + node.name, `
    <div style="text-align:center">
      <${tag} controls style="${kind === 'video' ? 'max-width:100%;max-height:60vh;border-radius:8px;' : 'width:100%;max-width:500px;'}">
        <source src="${url}"${mime ? ` type="${mime}"` : ''}>
        SHINKOR OS не поддерживает этот формат файла.
      </${tag}>
      <div style="font-size:13px;color:#888;margin-top:8px">
        ${formatSize(node.size || 0)}
      </div>
      <div class="actions" style="margin-top:12px">
        <button class="btn-cancel" onclick="closeModal()">Закрыть</button>
      </div>
    </div>
  `);

  // Освобождаем URL при закрытии модалки
  const overlay = document.getElementById('overlay');
  const cleanup = () => {
    URL.revokeObjectURL(url);
    overlay.removeEventListener('click', cleanup);
  };
  overlay.addEventListener('click', cleanup);
}
/* ---------- Определение MIME-типа (вспомогательная) ---------- */

function guessMime(name) {
  const ext = (name.match(/\.([^.]+)$/) || [])[1]?.toLowerCase();
  const map = {
    mp4: 'video/mp4',     webm: 'video/webm',     ogv: 'video/ogg',
    mov: 'video/quicktime', mkv: 'video/x-matroska', avi: 'video/x-msvideo',
    mp3: 'audio/mpeg',    wav: 'audio/wav',        ogg: 'audio/ogg',
    flac: 'audio/flac',   m4a: 'audio/mp4',        aac: 'audio/aac',
  };
  return map[ext] || '';
}

/* ---------- Загрузка файлов ---------- */

async function handleUpload(fileList) {
  const dir = getCurrentDir();
  for (const file of fileList) {
    const buf = await file.arrayBuffer();
    const name = makeUnique(dir, file.name.replace(/\.[^.]+$/, ''), file.name.match(/[^.]+$/)?.[0]);
    dir.children.set(name, {
      type: 'file',
      name,
      content: buf,
      size: buf.byteLength,
    });
  }
  document.getElementById('file-input').value = '';
  render();
}

/* ---------- Drag & Drop ---------- */

function handleDragOver(e) {
  e.preventDefault();
  document.getElementById('main').classList.add('drag-over');
}

function handleDragLeave(e) {
  if (e.target.id === 'main') {
    document.getElementById('main').classList.remove('drag-over');
  }
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('main').classList.remove('drag-over');
  if (e.dataTransfer.files && e.dataTransfer.files.length) {
    handleUpload(e.dataTransfer.files);
  }
}

/* ---------- Модальное окно ---------- */

function showModal(title, innerHTML) {
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  modal.innerHTML = `<h2>${escapeHtml(title)}</h2>${innerHTML}`;
  overlay.classList.add('active');
}

function closeModal(e) {
  if (e && e.target.id !== 'overlay' && !e.target.classList.contains('btn-cancel')) return;
  document.getElementById('overlay').classList.remove('active');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    hideCtxMenu();
    selectedName = null;
    render();
  }
  if (e.key === 'Delete' && selectedName) {
    deleteItem(selectedName);
  }
  if (e.key === 'F2' && selectedName) {
    renamePrompt(selectedName);
  }
});

/* ---------- Очистка ---------- */

function clearAll() {
  root.children.clear();
  currentPath = [];
  selectedName = null;
  render();
}

async function downloadvirtualdisc() {
  const zip = new JSZip();

  function addNodeToZip(node, path) {
    if (node.type === 'file') {
      // Добавляем файл в архив с правильным путём
      zip.file(path + '/' + node.name, node.content);
    } else if (node.type === 'dir') {
      // Рекурсивно обходим детей
      for (const [childName, childNode] of node.children.entries()) {
        addNodeToZip(childNode, path + '/' + childName);
      }
    }
  }

  // Начинаем обход с корня; начальный путь — пустая строка, но при добавлении файлов будет "/"
  for (const [name, node] of root.children.entries()) {
    addNodeToZip(node, name);
  }

  try {
    const content = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    a.href = url;
    a.download = '[RamDisk_DATA].zip';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    console.error('Ошибка при создании ZIP:', e);
    alert('Не удалось создать архив: ' + e.message);
  }
}

render();
</script>
