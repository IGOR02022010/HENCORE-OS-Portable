<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark PDF Viewer</title>
<style>
  :root{
    --bg:#0b0d10;
    --panel:#14171c;
    --panel-2:#191d24;
    --border:#262b33;
    --text:#e6e9ef;
    --muted:#8b93a1;
    --accent:#5b8cff;
    --accent-2:#8a63ff;
    --danger:#ff6b6b;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 20% -10%, #171c26 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;
    overflow:hidden;
  }

  /* ---------- Toolbar ---------- */
  #toolbar{
    display:flex;align-items:center;gap:12px;
    padding:10px 16px;
    background:rgba(20,23,28,.82);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    z-index:10;
  }
  .tb-left,.tb-center,.tb-right{display:flex;align-items:center;gap:8px}
  .tb-left{flex:1 1 auto;min-width:180px}
  .tb-center{flex:0 1 auto}
  .tb-right{flex:1 1 auto;justify-content:flex-end}
  .logo{
    width:34px;height:34px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    border-radius:10px;font-size:11px;font-weight:700;letter-spacing:.5px;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 4px 14px rgba(91,140,255,.35);
  }
  .file-name{
    font-size:13px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;
  }
  .sep{width:1px;height:22px;background:var(--border)}

  button{
    appearance:none;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);
    font:inherit;font-size:13px;
    padding:7px 12px;border-radius:10px;cursor:pointer;
    transition:background .15s,border-color .15s,transform .06s;
    display:inline-flex;align-items:center;gap:6px;
    user-select:none;white-space:nowrap;
  }
  button:hover{background:#20262f;border-color:#39414d}
  button:active{transform:translateY(1px)}
  button.icon{padding:7px 10px;font-size:15px;line-height:1}
  button.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border-color:transparent;color:#fff;font-weight:600;
  }
  button.primary:hover{filter:brightness(1.1)}
  button:disabled{opacity:.4;cursor:default;transform:none}

  #pageInput{
    width:56px;text-align:center;
    background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:7px 4px;font:inherit;font-size:13px;
    outline:none;
  }
  #pageInput:focus{border-color:var(--accent)}
  #zoomLabel{min-width:48px;text-align:center;font-size:13px;color:var(--muted)}

  /* ---------- Stage ---------- */
  #stage{
    position:relative;flex:1;
    overflow:auto;
    background:
      radial-gradient(800px 400px at 80% 110%, rgba(138,99,255,.06), transparent 60%),
      var(--bg);
  }

  #dropzone{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    cursor:pointer;
  }
  #dropzone .dz-card{
    display:flex;flex-direction:column;align-items:center;gap:16px;
    padding:56px 64px;
    border:2px dashed #2e3540;border-radius:20px;
    background:rgba(20,23,28,.5);
    transition:border-color .2s,background .2s;
    text-align:center;
  }
  #dropzone:hover .dz-card,
  #dropzone.drag .dz-card{
    border-color:var(--accent);
    background:rgba(91,140,255,.07);
  }
  #dropzone .dz-icon{
    width:72px;height:72px;border-radius:18px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 10px 30px rgba(91,140,255,.3);
  }
  #dropzone h2{font-size:18px;font-weight:600}
  #dropzone p{font-size:13px;color:var(--muted)}

  #viewerWrap{
    position:absolute;left:50%;top:50%;
    width:calc(100% - 32px);height:calc(100% - 32px);
    transform:translate(-50%,-50%);
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--border);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    transition:transform .25s ease;
    background:#1a1d23;
  }
  #viewerWrap.hidden{display:none}
  #viewer{width:100%;height:100%;border:0;display:block;background:#1a1d23}

  /* ---------- Footer / toast ---------- */
  #footer{
    padding:6px 16px;font-size:12px;color:var(--muted);
    border-top:1px solid var(--border);
    background:rgba(20,23,28,.82);
    display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
  }
  #footer kbd{
    background:var(--panel-2);border:1px solid var(--border);
    border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:11px;
    font-family:inherit;
  }

  #toast{
    position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);
    background:#22282f;border:1px solid var(--border);color:var(--text);
    padding:10px 18px;border-radius:12px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
    box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{border-color:rgba(255,107,107,.5)}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2b323c;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#39414d}
  ::-webkit-scrollbar-corner{background:transparent}

  @media (max-width:760px){
    .file-name{max-width:40vw}
    #toolbar{gap:8px;padding:8px 10px}
    button{padding:6px 9px}
    #footer{display:none}
  }
</style>
</head>
<body>

<header id="toolbar">
  <div class="tb-left">
    <div class="logo">PDF</div>
    <span id="fileName" class="file-name">Файл не открыт</span>
  </div>

  <div class="tb-center">
    <button id="btnPrev" class="icon" title="Предыдущая страница">&#8249;</button>
    <input id="pageInput" type="number" min="1" value="1" title="Номер страницы">
    <button id="btnNext" class="icon" title="Следующая страница">&#8250;</button>
    <div class="sep"></div>
    <button id="btnZoomOut" class="icon" title="Уменьшить">&minus;</button>
    <span id="zoomLabel">100%</span>
    <button id="btnZoomIn" class="icon" title="Увеличить">+</button>
    <div class="sep"></div>
    <button id="btnRotate" class="icon" title="Повернуть">&#8635;</button>
    <button id="btnReset" title="Сбросить вид">Сброс</button>
  </div>

  <div class="tb-right">
    <button id="btnOpen" class="primary">Открыть файл</button>
    <button id="btnTab" class="icon" title="Открыть в новой вкладке">&#8599;</button>
    <button id="btnDownload" class="icon" title="Скачать">&#8681;</button>
    <button id="btnPrint" class="icon" title="Печать">&#9114;</button>
    <button id="btnFullscreen" class="icon" title="Полный экран">&#9974;</button>
  </div>
</header>

<main id="stage">
  <div id="dropzone">
    <div class="dz-card">
      <div class="dz-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M12 18v-6"/>
          <path d="m9 15 3 3 3-3"/>
        </svg>
      </div>
      <h2>Перетащите PDF-файл сюда</h2>
      <p>или нажмите, чтобы выбрать файл с компьютера</p>
    </div>
  </div>
  <div id="viewerWrap" class="hidden">
    <iframe id="viewer" title="Просмотр PDF"></iframe>
  </div>
</main>

<footer id="footer">
  <span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> — страницы</span>
  <span><kbd>+</kbd> <kbd>&minus;</kbd> — масштаб</span>
  <span><kbd>R</kbd> — поворот</span>
  <span><kbd>Ctrl</kbd>+<kbd>O</kbd> — открыть файл</span>
</footer>

<div id="toast"></div>
<input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>

<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };
  var stage = $("stage"), wrap = $("viewerWrap"), viewer = $("viewer"),
      drop = $("dropzone"), fileInput = $("fileInput");

  var url = null, fileName = "", page = 1, zoom = 100, rotation = 0;
  var ZOOM_MIN = 25, ZOOM_MAX = 400;

  var toastTimer = null;
  function toast(msg, isErr){
    var t = $("toast");
    t.textContent = msg;
    t.className = "show" + (isErr ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className = ""; }, 2600);
  }

  function isPdf(file){
    return !!file && (
      file.type === "application/pdf" ||
      /\.pdf$/i.test(file.name || "")
    );
  }

  function openFile(file){
    if(!isPdf(file)){ toast("Это не похоже на PDF-файл", true); return; }
    if(url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(file);
    fileName = file.name || "document.pdf";
    $("fileName").textContent = fileName;
    document.title = fileName + " — Dark PDF Viewer";
    page = 1; zoom = 100; rotation = 0;
    drop.classList.add("hidden");
    wrap.classList.remove("hidden");
    applyView();
    toast("Файл открыт: " + fileName);
  }

  function applyView(){

    viewer.src = url + "#page=" + page + "&zoom=" + zoom + "&toolbar=0&navpanes=0&view=FitH";
    $("zoomLabel").textContent = zoom + "%";
    $("pageInput").value = page;
    applyRotation();
  }

  function applyRotation(){
    if(!url) return;
    var r = ((rotation % 360) + 360) % 360;
    var rect = stage.getBoundingClientRect();
    var w = rect.width - 32, h = rect.height - 32;
    if(r === 90 || r === 270){
      wrap.style.width = h + "px";
      wrap.style.height = w + "px";
    } else {
      wrap.style.width = "calc(100% - 32px)";
      wrap.style.height = "calc(100% - 32px)";
    }
    wrap.style.transform = "translate(-50%,-50%) rotate(" + r + "deg)";
  }

  function setPage(p){
    if(!url) return;
    p = Math.max(1, Math.floor(p) || 1);
    if(p === page) return;
    page = p;
    applyView();
  }

  function setZoom(z){
    if(!url) return;
    z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(z)));
    if(z === zoom) return;
    zoom = z;
    applyView();
  }

  $("btnOpen").addEventListener("click", function(){ fileInput.click(); });
  drop.addEventListener("click", function(){ fileInput.click(); });

  fileInput.addEventListener("change", function(){
    if(fileInput.files && fileInput.files[0]) openFile(fileInput.files[0]);
    fileInput.value = "";
  });

  $("btnPrev").addEventListener("click", function(){ setPage(page - 1); });
  $("btnNext").addEventListener("click", function(){ setPage(page + 1); });

  $("pageInput").addEventListener("change", function(){
    setPage(parseInt(this.value, 10));
  });
  $("pageInput").addEventListener("keydown", function(e){
    if(e.key === "Enter") setPage(parseInt(this.value, 10));
  });

  $("btnZoomIn").addEventListener("click", function(){ setZoom(zoom + 10); });
  $("btnZoomOut").addEventListener("click", function(){ setZoom(zoom - 10); });

  $("btnRotate").addEventListener("click", function(){
    if(!url) return;
    rotation = (rotation + 90) % 360;
    applyRotation();
  });

  $("btnReset").addEventListener("click", function(){
    if(!url) return;
    zoom = 100; rotation = 0;
    applyView();
    toast("Вид сброшен");
  });

  $("btnDownload").addEventListener("click", function(){
    if(!url) return;
    var a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  $("btnTab").addEventListener("click", function(){
    if(!url) return;
    window.open(url, "_blank");
  });

  $("btnPrint").addEventListener("click", function(){
    if(!url) return;
    try{
      viewer.contentWindow.print();
    }catch(e){
      window.open(url, "_blank");
      toast("Печать через панель вкладки", true);
    }
  });

  $("btnFullscreen").addEventListener("click", function(){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(function(){});
  });

  var dragDepth = 0;
  document.addEventListener("dragenter", function(e){
    e.preventDefault();
    dragDepth++;
    drop.classList.add("drag");
    if(wrap.classList.contains("hidden")) drop.classList.remove("hidden");
  });
  document.addEventListener("dragleave", function(e){
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if(dragDepth === 0) drop.classList.remove("drag");
  });
  document.addEventListener("dragover", function(e){ e.preventDefault(); });
  document.addEventListener("drop", function(e){
    e.preventDefault();
    dragDepth = 0;
    drop.classList.remove("drag");
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) openFile(f);
    else if(!wrap.classList.contains("hidden")) drop.classList.add("hidden");
  });

  document.addEventListener("keydown", function(e){
    var tag = (e.target.tagName || "").toLowerCase();
    if(tag === "input" || tag === "textarea") return;
    if(e.ctrlKey || e.metaKey){
      if(e.key.toLowerCase() === "o"){ e.preventDefault(); fileInput.click(); }
      return;
    }
    if(!url) return;
    switch(e.key){
      case "ArrowLeft":  setPage(page - 1); break;
      case "ArrowRight": setPage(page + 1); break;
      case "+": case "=": setZoom(zoom + 10); break;
      case "-": case "_": setZoom(zoom - 10); break;
      case "r": case "R": case "к": case "К":
        rotation = (rotation + 90) % 360; applyRotation(); break;
      case "0": setZoom(100); break;
    }
  });

  window.addEventListener("resize", applyRotation);
  window.addEventListener("beforeunload", function(){
    if(url) URL.revokeObjectURL(url);
  });
})();
</script>
</body>
</html>
